name: 'my_new_project'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
# This tells dbt which schema to write each folder's models to
models:
  my_new_project:
    staging:
      +materialized: view
      +schema: SILVER
    gold:
      +materialized: table
      +schema: GOLD
